
name: CI Frontend CINÉLUX

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  IMAGEN: ${{ secrets.DOCKER_USERNAME_FRONT }}/cine-dip-front:${{ github.sha }}

jobs:
  pruebas:
    name: Pruebas-compilación
    runs-on: ubuntu-latest

    steps:
      - name: Descargar-código
        uses: actions/checkout@v4

      - name: Instalar-Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar-dependencias
        run: npm ci

      - name: Ejecutar-pruebas-automatizadas
        run: npm test

      - name: Compilar-frontend
        run: npm run build

  docker:
    name: Construir-imagen-Docker
    needs: pruebas
    runs-on: ubuntu-latest

    steps:
      - name: Descargar-código
        uses: actions/checkout@v4

      - name: Iniciar-sesión-DockerHub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME_FRONT }}
          password: ${{ secrets.DOCKER_PASSWORD_FRONT }}

      - name: Construir-imagen-Docker
        run: docker build -f Dockerfile -t $IMAGEN .

      - name: Publicar-imagen-Docker
        run: docker push $IMAGEN
